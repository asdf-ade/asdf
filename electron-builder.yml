# Reverse of where the project lives. Changing this after a release ships makes
# Windows treat the next build as a different app and install it alongside.
appId: io.github.asdf-ade.asdf
productName: asdf
copyright: Copyright © asdf contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# node-pty ships N-API prebuilds, which are ABI-stable and load under Electron
# as they are. Rebuilding them from source would need Python and a compiler on
# every machine that packages the app, to produce the binary already in the box.
npmRebuild: false

# node-pty ships a native addon and, on Windows, conpty.dll plus OpenConsole.exe
# next to it. Unpacked so the loader can find them inside the installed app.
asarUnpack:
  - "**/node_modules/node-pty/**"

publish:
  provider: github
  owner: asdf-ade
  repo: asdf
  # release-please has already published the release for this tag. Without
  # this, electron-builder defaults to "draft", refuses the existing release
  # ("existing type not compatible with publishing type") and uploads nothing.
  releaseType: release

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  target:
    - AppImage
    - deb
